[pytest]
# ⚠️ `bot/tests` 는 여기 없다 — **한 세션에 합치면 깨진다**(2026-09-12 실측:
# 73건 실패). `bot/tests/conftest.py` 가 `sys.modules` 에 `bot.cache`·
# `bot.usage_tracker`·`yfinance`·`langchain_core` 를 **모듈 레벨로** 꽂아,
# 같은 프로세스에서 수집되면 `tests/` 의 단가·비용·캘린더 테스트가 그 mock 을
# 진짜로 읽는다(#30 테스트가 운영 상태를 오염시킨다의 세션판).
# 그래서 두 슈트를 **별도 프로세스**로 돌린다 — `make test` 가 둘 다 돌린다.
# 범위를 한 곳에서만 선언한다는 규칙(#38)은 지켜진다: 여기 = 기본 슈트,
# Makefile = 게이트(기본 + bot/tests 를 각자 프로세스로).
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: fast isolated unit tests
    integration: tests requiring external services
    smoke: quick sanity-check tests
    regression: 실제 surfaced 버그 영구 재발 차단 (tests/test_regression.py)
